<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Learner Trajectories</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEDF2; --sunken:#E5E9EF;
    --ink:#14171C; --ink-2:#535A68; --ink-3:#868D9B;
    --rule:#DCE0E7; --rule-2:#C5CBD5;
    --agent:#2C5B89; --agent-bg:#F0F5FA;
    --user:#9F4D2B; --user-bg:#FBF3EF;
    --insight:#6B4C9A; --insight-bg:#F4F1FA; --insight-edge:#D0C3E6; --defect:#A3352F; --defect-bg:#F8E6E4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#111318; --surface:#191C22; --surface-2:#20242B; --sunken:#15181D;
      --ink:#E8EAEF; --ink-2:#A2A9B7; --ink-3:#7B8390;
      --rule:#282D35; --rule-2:#39404A;
      --agent:#84B0DC; --agent-bg:#161E27;
      --user:#DE9670; --user-bg:#241A15;
      --insight:#B69BE0; --insight-bg:#1D1828; --insight-edge:#39304B; --defect:#E58A84; --defect-bg:#2D1B1A;
    }
  }
  :root[data-theme="dark"]{
    --ground:#111318; --surface:#191C22; --surface-2:#20242B; --sunken:#15181D;
    --ink:#E8EAEF; --ink-2:#A2A9B7; --ink-3:#7B8390;
    --rule:#282D35; --rule-2:#39404A;
    --agent:#84B0DC; --agent-bg:#161E27;
    --user:#DE9670; --user-bg:#241A15;
    --insight:#B69BE0; --insight-bg:#1D1828; --insight-edge:#39304B; --defect:#E58A84; --defect-bg:#2D1B1A;
  }

  *{box-sizing:border-box}
  body{background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:15.5px; line-height:1.62;
    -webkit-font-smoothing:antialiased}
  .mono,code,pre{font-family:"IBM Plex Mono",ui-monospace,monospace}
  button{appearance:none; border:none; background:none; cursor:pointer; font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--agent); outline-offset:2px}

  /* ---------- top ---------- */
  .top{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--rule)}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px}
  .top .wrap{padding-top:15px; display:flex; flex-direction:column; gap:12px}
  .row1{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  h1{font-family:Spectral,Georgia,serif; font-size:1.3rem; font-weight:600; margin:0; letter-spacing:-.01em}
  .modes{margin-left:auto; display:flex; gap:1px; background:var(--rule); border-radius:5px; padding:1px}
  .modes button{padding:5px 13px; font-family:"IBM Plex Mono",monospace; font-size:.73rem; color:var(--ink-3); border-radius:4px}
  .modes button[aria-pressed="true"]{background:var(--surface); color:var(--ink)}
  .nav{display:flex; gap:2px; overflow-x:auto}
  .nav button{padding:8px 14px 10px; font-family:"IBM Plex Mono",monospace; font-size:.78rem;
              color:var(--ink-3); border-bottom:2px solid transparent; white-space:nowrap}
  .nav button:hover{color:var(--ink-2)}
  .nav button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--agent); font-weight:500}

  main{max-width:1180px; margin:0 auto; padding:22px 24px 90px}
  .body{padding:16px 19px 19px; font-size:.95rem}
  .body>*:first-child{margin-top:0} .body>*:last-child{margin-bottom:0}
  .body h2{font-size:1rem; margin:17px 0 8px; font-weight:600}
  .body h3{font-size:.92rem; margin:14px 0 6px; font-weight:600; color:var(--ink-2)}
  .body p{margin:0 0 10px}
  .body ul,.body ol{margin:0 0 11px; padding-left:21px; display:flex; flex-direction:column; gap:3px}
  .body code{background:var(--surface-2); padding:.09em .33em; border-radius:3px; font-size:.86em}
  .body pre{background:var(--sunken); border:1px solid var(--rule); border-radius:5px; padding:11px 13px;
            overflow-x:auto; margin:0 0 12px; font-size:.79rem; line-height:1.55}
  .body pre code{background:none; padding:0}
  .body hr{border:none; border-top:1px solid var(--rule); margin:14px 0}
  .body strong{font-weight:600; color:var(--ink)}
  .insight{background:var(--insight-bg); border:1px solid var(--insight-edge); border-left:3px solid var(--insight);
           border-radius:5px; padding:12px 15px; margin:0 0 12px}
  .insight .lab{font-family:"IBM Plex Mono",monospace; font-size:.66rem; text-transform:uppercase;
                letter-spacing:.09em; color:var(--insight); display:block; margin-bottom:6px}
  .insight p:last-child{margin-bottom:0}
  .tools{background:var(--sunken); border-bottom:1px solid var(--rule); padding:4px 15px 11px;
         max-height:320px; overflow-y:auto; display:none; flex-direction:column; gap:5px}
  .tools.open{display:flex}
  .tl{display:grid; grid-template-columns:88px 1fr; gap:10px; font-family:"IBM Plex Mono",monospace;
      font-size:.73rem; line-height:1.5}
  .tl .n{color:var(--ink-2)} .tl.hi .n{color:var(--agent); font-weight:500}
  .tl .d{color:var(--ink-3); white-space:pre-wrap; word-break:break-word}
  .tally{font-family:"IBM Plex Mono",monospace; font-size:.71rem; color:var(--ink-3); white-space:nowrap}

  /* ---------- compare ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; align-items:start}
  .col{background:var(--surface); border:1px solid var(--rule); border-radius:7px; overflow:hidden;
       display:flex; flex-direction:column; max-height:74vh}
  .col.agent{border-top:3px solid var(--agent)} .col.user{border-top:3px solid var(--user)}
  .col.task{border-top:3px solid var(--rule-2)}
  .colhead{padding:11px 15px; border-bottom:1px solid var(--rule); display:flex; align-items:baseline;
           gap:10px; background:var(--surface-2)}
  .colhead .cond{font-family:"IBM Plex Mono",monospace; font-size:.79rem; font-weight:500}
  .colhead .tally{margin-left:auto}
  .col .scroll{overflow-y:auto; padding:0}
  .col .body{font-size:.88rem; padding:14px 16px 17px}
  .col .tools{max-height:none; display:flex; border-bottom:1px solid var(--rule)}
  .elide{border:1px solid var(--rule-2); border-radius:5px; padding:5px 12px;
          font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3)}
  .elide[aria-pressed="true"]{background:var(--surface); color:var(--ink-2); border-color:var(--ink-3)}
  .fold{display:block; width:100%; text-align:left; margin:0 0 10px; padding:5px 10px;
        border:1px dashed var(--rule-2); border-radius:4px; background:none;
        font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3)}
  .fold:hover{color:var(--ink-2); border-color:var(--ink-3)}
  .fold.open{border-style:solid; margin-bottom:6px}
  /* ---------- legend + counts (new mode) ---------- */
  .legend{display:grid; gap:9px 14px; margin:0 0 6px; padding:14px;
          background:var(--surface); border:1px solid var(--rule); border-radius:7px}
  .legend .item{display:grid; grid-template-columns:78px 1fr; align-items:baseline; gap:9px;
                font-size:.8rem; color:var(--ink-2); min-width:0}
  .legend .item .tag{margin:0; justify-self:start}
  .counts{border-collapse:collapse; margin:0 0 20px; font-size:.79rem; background:var(--surface);
          border:1px solid var(--rule); border-radius:6px; overflow:hidden}
  .counts th,.counts td{padding:6px 11px; text-align:right; border-bottom:1px solid var(--rule);
                        font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  .counts thead th{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em;
                   background:var(--surface-2); color:var(--ink-3); font-weight:500}
  .counts th.rh{text-align:left; color:var(--ink); font-weight:500; white-space:nowrap}
  .counts th.rh small{color:var(--ink-3); font-weight:400}
  .counts tbody tr:last-child td, .counts tbody tr:last-child th{border-bottom:none}
  .counts td.z{color:var(--ink-3); opacity:.45}
  .counts td.mx{font-weight:600; color:var(--ink)}
  .cwrap{overflow-x:auto}
  /* ---------- new mode: rows are turns, columns are conditions ---------- */
  .newgrid{display:grid; gap:0 14px}
  .chead{position:sticky; top:100px; z-index:5; background:var(--ground); padding:6px 0 8px;
         font-family:"IBM Plex Mono",monospace; font-size:.8rem; font-weight:500; color:var(--ink)}
  .rowlabel{grid-column:1/-1; display:flex; align-items:center; gap:10px; margin:16px 0 8px;
            font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase}
  .rowlabel.agent{color:var(--agent)} .rowlabel.user{color:var(--user)}
  .rowlabel::after{content:""; flex:1; height:1px; background:var(--rule)}
  .cell{background:var(--surface); border:1px solid var(--rule); border-radius:7px; padding:4px 0 8px;
        align-self:stretch; min-width:0}
  .cell.agent{border-top:2px solid var(--agent)} .cell.user{border-top:2px solid var(--user)}
  .cell.empty{background:none; border:1px dashed var(--rule); display:flex; align-items:center;
              justify-content:center; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:.72rem}
  .sblk{padding:2px 14px 0; font-size:.87rem}
  .sblk .tag{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.6rem; font-weight:500;
             text-transform:uppercase; letter-spacing:.07em; padding:1px 6px; border-radius:3px; margin-bottom:4px}
  .tag.insight{background:var(--insight-bg); color:var(--insight)}
  .tag.tested{background:var(--agent-bg); color:var(--agent)}
  .tag.handoff{background:var(--user-bg); color:var(--user)}
  .tag.probe{background:var(--user-bg); color:var(--user)}
  .tag.defect{background:var(--defect-bg); color:var(--defect)}
  .tag.accept{background:var(--surface-2); color:var(--ink-3)}
  .sblk .body{padding:0 0 8px}
  .sblk .insight{margin-bottom:8px}
  .appendix{margin-top:56px; padding-top:22px; border-top:1px solid var(--rule)}
  .appendix h2{font-family:"IBM Plex Mono",monospace; font-size:.72rem; text-transform:uppercase;
               letter-spacing:.1em; color:var(--ink-3); font-weight:500; margin:0 0 14px}
  .appendix .legend{font-size:.76rem}
  .appendix .counts{font-size:.75rem}
  .more{margin:2px 14px 10px; padding:3px 9px; border:1px dashed var(--rule-2); border-radius:4px;
        background:none; display:block; width:calc(100% - 30px); text-align:left;
        font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-3)}
  .more:hover{color:var(--ink-2); border-color:var(--ink-3)}
  .identical{grid-column:1/-1; font-size:.85rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace;
             padding:2px 2px 6px}
</style>
</head>

    }
    if(/^```/.test(l)){ close(); const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue; }
    if(/^#{1,6}\s/.test(l)){ close(); const lv=l.match(/^#+/)[0].length;
      out.push(`<h${lv<=2?2:3}>${inline(l.replace(/^#+\s*/,''))}</h${lv<=2?2:3}>`); i++; continue; }
    if(isRule(l) || /^(\*\*\*|---|___)\s*$/.test(l)){ close(); out.push('<hr>'); i++; continue; }
    if(/^\s*[-*+]\s+/.test(l)){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; }
      out.push(`<li>${inline(l.replace(/^\s*[-*+]\s+/,''))}</li>`); i++; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; }
      out.push(`<li>${inline(l.replace(/^\s*\d+[.)]\s+/,''))}</li>`); i++; continue; }
    if(!l.trim()){ close(); i++; continue; }
    const buf=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i])
          && !isRule(lines[i]) && !/★\s*Insight/.test(lines[i])){ buf.push(lines[i]); i++; }
    close(); out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  close(); return out.join('');
}

function bodyHTML(t){
  const bl = t.blocks || [{t:t.text, s:0}];
  let out = [], run = [];
  const flush = () => {
    if(!run.length) return;
    const n = run.length, inner = run.map(b => md(b.t)).join('');
    out.push(hideShared
      ? `<div class="foldwrap"><button class="fold">▸ ${n} line${n>1?'s':''} also in the other conditions</button>`
        + `<div class="folded" hidden>${inner}</div></div>`
      : inner);
    run = [];
  };
  bl.forEach(b => { if(hideShared && b.s >= 2) run.push(b); else { flush(); out.push(md(b.t)); } });
  flush();
  return out.join('');
}
function wireFolds(root){
  root.querySelectorAll('.fold').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const box = btn.nextElementSibling, open = box.hidden;
    box.hidden = !open; btn.classList.toggle('open', open);
    btn.textContent = (open ? '▾ ' : '▸ ') + btn.textContent.replace(/^[▸▾]\s*/,'');
  });
}
const roleOf = t => t.role === 'task' ? 'task' : t.role;
const nameOf = t => t.role === 'task' ? 'Task' : t.role === 'agent' ? 'Agent' : 'User';
function gistOf(t){
  const s = t.text.replace(/[#*`─—>]/g,' ').replace(/\s+/g,' ').trim();
  return s.length > 150 ? s.slice(0,150) + '…' : s;
}
function tallyOf(t){
  if(!t.tools.length) return 'no tools';
  const c = {}; t.tools.forEach(x => c[x.n] = (c[x.n]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}×${v}`).join('  ');
}
const toolsHTML = t => t.tools.length ? `<div class="tools">${t.tools.map(x =>
    `<div class="tl${/Bash|Skill/.test(x.n)?' hi':''}"><span class="n">${esc(x.n)}</span><span class="d">${esc(x.d)}</span></div>`
  ).join('')}</div>` : '';

function renderCompare(){
  const same = slot === 0;
  document.getElementById('view').innerHTML = `<div class="grid">${
    same ? `<div class="identical">Identical in all four conditions.</div>` : ''}${
    (same ? ['baseline'] : CONDS).map(c => {
      const t = DATA[c].turns[slot];
      if(!t) return `<section class="col"><div class="colhead"><span class="cond">${LABEL[c] || c}</span></div>
        <div class="scroll"><div class="body"><p style="color:var(--ink-3)">No turn here — single run, no simulated user.</p></div></div></section>`;
      return `<section class="col ${roleOf(t)}">
        <div class="colhead"><span class="cond">${same ? 'task prompt' : c}</span>
          <span class="tally">${esc(tallyOf(t))}</span></div>
        <div class="scroll">${toolsHTML(t).replace('class="tools"','class="tools open"')}
          <div class="body">${bodyHTML(t)}</div></div>
      </section>`;
    }).join('')}</div>`;
  wireFolds(document.getElementById('view'));
}

const TAGDEF = [['insight','★ Insight block'], ['handoff','left work for the user'],
  ['defect','found or fixed an error'], ['tested','ran a test, traced, or cited code'],
  ['probe','asked how or why'], ['accept','declared it good / done']];

function tagCounts(){
  const rows = [];
  CONDS.forEach(c => ['agent','user'].forEach(role => {
    const n = {}; let fold = 0, cov = 0;
    DATA[c].turns.forEach(t => { if(t.role !== role) return;
      (t.blocks||[]).forEach(b => {
        if(!b.new) fold++; else if(b.sig) n[b.sig] = (n[b.sig]||0)+1; else cov++;
      });
    });
    rows.push({c, role, n, cov, fold});
  }));
  return rows;
}
function countsTable(){
  const rows = tagCounts(), keys = TAGDEF.map(t => t[0]);
  const max = {}; keys.forEach(k => max[k] = Math.max(...rows.map(r => r.n[k]||0)));
  return `<div class="cwrap"><table class="counts">
    <thead><tr><th class="rh">condition</th>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr><th class="rh">${r.c} <small>· ${r.role}</small></th>${
      keys.map(k => { const v = r.n[k]||0;
        return `<td class="${v===0?'z':(v===max[k]&&v>0?'mx':'')}">${v}</td>`; }).join('')
      }</tr>`).join('')}
    </tbody></table></div>`;
}

function renderNew(){
  const cols = CONDS.length;
  const slots = DATA[CONDS[0]].turns.map((t,i)=>({i, role:t.role, round:t.round})).filter(x=>x.role!=='task');
  const cellHTML = (c, slot) => {
    const t = DATA[c].turns[slot];
    if(!t) return `<div class="cell empty">no turn</div>`;
    const bl = t.blocks || [], keep = bl.filter(b=>b.new), drop = bl.length - keep.length;
    const body = keep.map(b =>
      `<div class="sblk">${b.sig ? `<span class="tag ${b.sig}">${b.sig}</span>` : ''}<div class="body">${md(b.t)}</div></div>`
    ).join('') || `<div class="sblk"><div class="body"><p style="color:var(--ink-3)">nothing distinctive</p></div></div>`;
    const more = drop ? `<button class="more">▸ ${drop} more lines</button><div class="folded" hidden>${
      bl.filter(b=>!b.new).map(b=>`<div class="sblk"><div class="body">${md(b.t)}</div></div>`).join('')}</div>` : '';
    return `<div class="cell ${t.role}">${body}${more}</div>`;
  };
  const colStyle = `grid-template-columns:repeat(${cols},minmax(0,1fr))`;
  const legend = `<div class="legend" style="${colStyle}">${TAGDEF.map(([k,d]) =>
    `<span class="item"><span class="tag ${k}">${k}</span><span>${d}</span></span>`).join('')}</div>`;
  const grid = [`<div class="newgrid" style="${colStyle}">`];
  CONDS.forEach(c => grid.push(`<div class="chead">${c}</div>`));
  slots.forEach(s2 => {
    grid.push(`<div class="rowlabel ${s2.role}">${s2.role} &middot; round ${s2.round}</div>`);
    CONDS.forEach(c => grid.push(cellHTML(c, s2.i)));
  });
  grid.push('</div>');

  document.getElementById('view').innerHTML = legend + grid.join('')
    + `<div class="appendix"><h2>Appendix &mdash; tag counts</h2>` + countsTable() + `</div>`;

  document.querySelectorAll('.more').forEach(btn => btn.onclick = () => {
    const box = btn.nextElementSibling, open = box.hidden;
    box.hidden = !open;
    btn.textContent = (open ? '▾ ' : '▸ ') + btn.textContent.replace(/^[▸▾]\s*/,'');
  });
}
function renderNav(){
  if(mode === 'new'){ document.getElementById('nav').innerHTML = ''; return; }
  document.getElementById('nav').innerHTML = SLOTS.map((s2, i) =>
    `<button data-i="${i}" aria-selected="${s2.i === slot}">${s2.label}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
    slot = SLOTS[+b.dataset.i].i; draw();
  });
}
function draw(){
  document.getElementById('mCompare').setAttribute('aria-pressed', String(mode === 'compare'));
  const eb = document.getElementById('mElide');
  eb.setAttribute('aria-pressed', String(hideShared));
  eb.textContent = hideShared ? 'hide shared lines' : 'show all lines';
  renderNav();
  document.getElementById('mNew').setAttribute('aria-pressed', String(mode === 'new'));
  document.getElementById('mElide').style.display = mode === 'new' ? 'none' : '';
  if(mode === 'new') renderNew(); else renderCompare();
}
document.getElementById('mCompare').onclick = () => { mode = 'compare'; draw(); };
document.getElementById('mNew').onclick = () => { mode = 'new'; draw(); };
document.getElementById('mElide').onclick = () => { hideShared = !hideShared; draw(); };
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if(mode === 'compare' && n >= 1 && n <= 5){ slot = SLOTS[n-1].i; draw(); }
  if(e.key === 's'){ hideShared = !hideShared; draw(); }
  if(e.key === 'c'){ mode = mode === 'new' ? 'compare' : 'new'; draw(); }
});
draw();
</script>
